name: 每日热点新闻自动更新
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 👇 全部升级到支持 Node.js 24 的最新版 → 无警告
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6

      - name: 安装依赖
        run: pip install requests
        
      # 👇 你的脚本真实路径在这里
      - name: 运行新闻脚本
        run: python .github/workflows/news_bot.py

      # 发送新闻到你的邮箱
      - name: 发送邮件到 youlione@126.com
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.126.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ?? 每日热点新闻
          body: 今日热点新闻已更新，内容请看附件??
          to: youlione@126.com
          from: GitHub Actions News Bot
          attachments: news.md
          convert_markdown: true

      # 👇 升级到支持 Node.js 24 的 v6 版，警告消失
      - name: 创建 issue
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 📰 每日热点新闻更新
          content-filepath: ./news.md

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.md
          git diff --quiet || git commit -m "📢 自动更新每日热点新闻"
          git push
